name: CalVer Release
description: >
  Per-package CalVer release for monorepos, in three phases. State lives in one
  root versions file, so there are no git tags and no commit-message markers.

  1. bump-versions   Work out the next version of every package this push
                     touched. Writes nothing and commits nothing — it only
                     produces the version numbers.
  2. (your build)    Tag and push your artifacts with those version numbers.
  3. commit-versions Record the versions in the versions file and commit them.
                     Run only after step 2 has pushed the artifacts, so the
                     recorded version always names something that exists.

inputs:
  phase:
    description: '"bump-versions" or "commit-versions".'
    required: false
    default: bump-versions
  manifest:
    description: Path to the release manifest JSON.
    required: false
    default: .github/release-packages.json
  versions:
    description: Path to the root versions file.
    required: false
    default: versions.json
  packages:
    description: >
      The plan to record, as JSON. Required in commit-versions — pass the
      `packages` output from the bump-versions step. It never recomputes, so the
      version that gets committed is exactly the one the artifacts were built
      with.
    required: false
    default: ''
  base-branch:
    description: Branch to commit and push to (commit-versions phase).
    required: false
    default: master
  deploy-workflow:
    description: >
      Workflow file to dispatch once after publishing, with a `packages` input
      holding the plan JSON. Leave empty to skip.
    required: false
    default: ''

outputs:
  changed:
    description: Comma-separated names of packages this push changed.
    value: ${{ steps.detect_list.outputs.list }}
  packages:
    description: JSON array of {name, version, previous} for released packages.
    value: ${{ steps.release.outputs.packages }}
  message:
    description: The commit message (subject + body).
    value: ${{ steps.release.outputs.message }}
  released:
    description: '"true" when at least one package was released.'
    value: ${{ steps.release.outputs.released }}

runs:
  using: composite
  steps:
    # detection only runs in the bump-versions phase; commit-versions is handed
    # the plan it produced.
    - id: filters
      if: inputs.phase == 'bump-versions'
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        {
          echo "filters<<__CALVER_EOF__"
          jq -r '.packages[] | "\(.name):\n" + ([.paths[] | "  - " + (. | @json)] | join("\n"))' "$MANIFEST"
          echo "__CALVER_EOF__"
        } >> "$GITHUB_OUTPUT"

    - id: detect
      if: inputs.phase == 'bump-versions'
      uses: dorny/paths-filter@v3
      with:
        filters: ${{ steps.filters.outputs.filters }}

    - id: detect_list
      if: inputs.phase == 'bump-versions'
      shell: bash
      env:
        CHANGES: ${{ steps.detect.outputs.changes }}
      run: echo "list=$(printf '%s' "$CHANGES" | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"

    - id: release
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PHASE: ${{ inputs.phase }}
        MANIFEST: ${{ inputs.manifest }}
        VERSIONS: ${{ inputs.versions }}
        CHANGED: ${{ steps.detect_list.outputs.list }}
        SET: ${{ inputs.packages }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
      run: |
        set -euo pipefail
        args=(--manifest "$MANIFEST" --versions "$VERSIONS" --phase "$PHASE")
        if [ "$PHASE" = commit-versions ]; then
          args+=(--set "$SET" --push)
        else
          args+=(--changed "$CHANGED")
        fi
        bash "$ACTION_PATH/calver-release.sh" "${args[@]}"
